<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop — EU</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0; }
  .region { color: #888; margin-top: 4px; }
  .qty {
    font-size: 5rem;
    font-weight: 700;
    margin: 32px 0 8px;
  }
  .sync {
    display: inline-block;
    margin-top: 24px;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.95rem;
    background: #e8f5e9;
    color: #2e7d32;
  }
  .sync.stale {
    background: #fdecea;
    color: #c0392b;
    font-weight: 600;
  }
  .status { min-height: 1.4em; margin-top: 20px; font-size: 0.95rem; color: #c0392b; }
</style>
</head>
<body>
  <h1>EU</h1>
  <div class="region">Frankfurt · read replica</div>

  <div class="qty" id="qty">--</div>
  <div>units in stock</div>

  <div class="sync" id="sync">last synced: -- </div>

  <div class="status" id="status"></div>

<script>
  const STALE_THRESHOLD_SECONDS = 5;

  const qtyEl = document.getElementById('qty');
  const syncEl = document.getElementById('sync');
  const statusEl = document.getElementById('status');

  async function refresh() {
    try {
      const res = await fetch('/stock');
      const body = await res.json();
      qtyEl.textContent = body.qty;

      const age = body.lastSyncedSecondsAgo;
      syncEl.textContent = `last synced: ${age}s ago`;
      syncEl.classList.toggle('stale', age > STALE_THRESHOLD_SECONDS);

      statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = 'Could not reach /stock: ' + e.message;
    }
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
