server:
  port: 8080

spring:
  application:
    name: api-eu
  datasource:
    # Same db name/user/password as the primary on purpose -- the standby
    # is a byte-for-byte copy of the primary's data directory (roles
    # included), it never ran its own initdb.
    url: jdbc:postgresql://${DB_HOST:db-eu}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop_pw}
    hikari:
      maximum-pool-size: 5
      read-only: true
